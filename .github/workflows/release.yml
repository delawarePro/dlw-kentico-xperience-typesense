name: "Release"

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    permissions:
      id-token: write # required for Trusted Publishing (OIDC token exchange with nuget.org)
      contents: write # required to create the GitHub Release with the built-in GITHUB_TOKEN

    defaults:
      run:
        shell: pwsh

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      DOTNET_NOLOGO: 1
      SIGN_FILE: false

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install dependencies
        run: dotnet restore --locked-mode

      - name: Build Solution
        run: dotnet build --configuration Release --no-restore

      - name: Test Solution
        run: dotnet test --configuration Release --no-build --no-restore

      - name: Pack the project
        run: dotnet pack --configuration Release --no-build --output ./output

      # Trusted Publishing: exchange the GitHub OIDC token for a short-lived (1h)
      # nuget.org API key. Runs immediately before the push so the key stays valid.
      # Requires a Trusted Publishing policy configured on nuget.org for this repo/workflow.
      - name: NuGet login (OIDC -> short-lived API key)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }} # nuget.org account/profile name (NOT the email address)

      - name: Publish to NuGet
        # --skip-duplicate makes the push idempotent: a version already on NuGet
        # (e.g. pushed by a previous partially-failed run) is skipped instead of
        # failing the whole release with a 409 Conflict.
        run: dotnet nuget push ./output/*.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub Release
        # Uses the built-in GITHUB_TOKEN (needs contents: write) via the gh CLI,
        # replacing the deprecated actions/create-release@v1 + RELEASE_TOKEN secret.
        # --skip-existing keeps the step idempotent across re-tags/re-runs.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --title "Release ${{ github.ref_name }}" --generate-notes --verify-tag || gh release edit "${{ github.ref_name }}" --title "Release ${{ github.ref_name }}"
